<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>The Nerd | SPM Tracker</title>
<style>
:root{color-scheme:dark;--panel:#121d30;--panel2:#18263d;--line:#293a54;--muted:#91a2bb;--text:#edf3fb;--accent:#8bd3ff;--green:#8ce0b2}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#172941,#0b1220 60%);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:1080px;margin:auto;padding:30px 16px 60px}.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
h1{font-size:clamp(34px,6vw,50px);line-height:1.05;margin:8px 0}p,.muted{color:var(--muted)}.sub{margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:25px 0}.stat,.subject{background:linear-gradient(145deg,var(--panel),#101a2b);border:1px solid var(--line);border-radius:16px}
.stat{padding:15px}.stat strong{display:block;font-size:26px}.stat span{font-size:12px;color:var(--muted)}
.progress{height:8px;background:#26364d;border-radius:20px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#68bdf0,#8ce0b2);transition:width .2s}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}.toolbar input,.toolbar select,button{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 12px;font:inherit}.toolbar input{flex:1;min-width:190px}button{cursor:pointer}button:hover{border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:14px}.subject{padding:17px}.head,.form-title{display:flex;justify-content:space-between;gap:10px;align-items:center}.subject h2{font-size:18px;margin:0}.subject small{color:var(--muted)}.count{color:var(--accent);font-size:12px;font-weight:800;white-space:nowrap}
.form-block{margin-top:16px}.form-title{font-size:13px;font-weight:750;margin-bottom:8px;color:#c4d2e4}.chapters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.chapter{display:flex;align-items:center;gap:9px;padding:9px;background:var(--panel2);border:1px solid transparent;border-radius:9px;font-size:13px;cursor:pointer}.chapter:hover{border-color:#4b6a8d}.chapter input{accent-color:#78c9f2;width:16px;height:16px;flex:none}.chapter:has(input:checked){color:var(--green);text-decoration:line-through;opacity:.72}
.note{font-size:12px;color:var(--muted);margin-top:22px;text-align:center}.empty{color:var(--muted);padding:22px;text-align:center}
@media(max-width:520px){main{padding:24px 13px 44px}.stats{gap:8px}.stat{padding:11px}.stat strong{font-size:21px}.chapters{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <div class="eyebrow">Personal study dashboard</div>
  <h1>The Nerd<span style="color:var(--accent)">.</span></h1>
  <p class="sub">SPM 2026 · 9-subject syllabus completion tracker</p>
  <section class="stats" aria-label="Progress summary">
    <div class="stat"><strong id="done">0</strong><span>Completed items</span></div>
    <div class="stat"><strong id="total">0</strong><span>Total checklist items</span></div>
    <div class="stat"><strong id="percent">0%</strong><span>Overall completion</span><div class="progress"><i id="bar"></i></div></div>
  </section>
  <div class="toolbar">
    <input id="search" type="search" placeholder="Search subjects or chapters…" aria-label="Search">
    <select id="filter" aria-label="Filter subjects">
      <option value="all">All subjects</option><option value="incomplete">In progress</option><option value="complete">Completed</option>
    </select>
    <button id="reset" type="button">Reset progress</button>
  </div>
  <div id="subjects" class="grid"></div>
  <div class="note">Tick an item when you have completed studying and practising it. Progress saves automatically in this browser on this device.</div>
</main>
<script>
const subjects = [
  {name:"Bahasa Melayu",forms:[
    {name:"Paper 1",items:["Bahagian A: Karangan respons terhad","Bahagian B: Karangan respons terbuka"]},
    {name:"Paper 2",items:["Bahagian A: Sistem dan Aplikasi Bahasa","Bahagian B: Pemahaman","Bahagian C: Rumusan"]}
  ]},
  {name:"English",forms:[
    {name:"Paper 1: Reading and Use of English",items:["Part 1: Short Texts","Part 2: Error Correction","Part 3: Information Transfer","Part 4: Short Texts","Part 5: Matching and Gapped Text"]},
    {name:"Paper 2: Writing",items:["Part 1: Email","Part 2: Guided Writing","Part 3: Extended Writing"]}
  ]},
  {name:"Sejarah",forms:[
    {name:"Form 4",items:Array.from({length:10},(_,i)=>"Bab "+(i+1))},
    {name:"Form 5",items:Array.from({length:10},(_,i)=>"Bab "+(i+1))}
  ]},
  {name:"Mathematics",forms:[
    {name:"Form 4",items:Array.from({length:10},(_,i)=>"Chapter "+(i+1))},
    {name:"Form 5",items:Array.from({length:8},(_,i)=>"Chapter "+(i+1))}
  ]},
  {name:"Additional Mathematics",forms:[
    {name:"Form 4",items:Array.from({length:10},(_,i)=>"Chapter "+(i+1))},
    {name:"Form 5",items:Array.from({length:8},(_,i)=>"Chapter "+(i+1))}
  ]},
  {name:"Physics",forms:[
    {name:"Form 4",items:Array.from({length:6},(_,i)=>"Chapter "+(i+1))},
    {name:"Form 5",items:Array.from({length:7},(_,i)=>"Chapter "+(i+1))}
  ]},
  {name:"Chemistry",forms:[
    {name:"Form 4",items:Array.from({length:8},(_,i)=>"Chapter "+(i+1))},
    {name:"Form 5",items:Array.from({length:5},(_,i)=>"Chapter "+(i+1))}
  ]},
  {name:"Biology",forms:[
    {name:"Form 4",items:Array.from({length:15},(_,i)=>"Chapter "+(i+1))},
    {name:"Form 5",items:Array.from({length:13},(_,i)=>"Chapter "+(i+1))}
  ]},
  {name:"Pendidikan Islam",forms:[
    {name:"Form 4",items:[
      "Pelajaran 1: Surah al-An'am, Ayat 162–163",
      "Pelajaran 2: Surah al-Kahfi, Ayat 101–110",
      "Pelajaran 3: Hukum Tajwid",
      "Pelajaran 4: Larangan Rasuah",
      "Pelajaran 5: Memahami Sunatullah",
      "Pelajaran 6: Larangan Mempersendakan Agama",
      "Pelajaran 7: Dakwah Pemacu Kemajuan",
      "Pelajaran 8: Hindari Dosa-dosa Besar",
      "Pelajaran 9: Kemuliaan Berdikari",
      "Pelajaran 10: Allah SWT Maha Pembalas dan Maha Perkasa",
      "Pelajaran 11: Perkara yang Membatalkan Iman",
      "Pelajaran 12: Hindari Ajaran Sesat",
      "Pelajaran 13: Haji dan Umrah",
      "Pelajaran 14: Sembelihan",
      "Pelajaran 15: Korban dan Akikah",
      "Pelajaran 16: Muamalat Islam",
      "Pelajaran 17: Solat Sunat Dhuha dan Solat Sunat Gerhana",
      "Pelajaran 18: Kerajaan Khulafa ar-Rasyidin",
      "Pelajaran 19: Kerajaan Umaiyah",
      "Pelajaran 20: Kerajaan Abbasiyah",
      "Pelajaran 21: Keunggulan Tokoh Empat Mazhab",
      "Pelajaran 22: Bersikap Benar Menjauhkan Kemunafikan",
      "Pelajaran 23: Khauf dan Raja'",
      "Pelajaran 24: Adab terhadap Orang Sakit dan Kurang Upaya",
      "Pelajaran 25: Wasatiah Menjamin Kecemerlangan Ummah"
    ]},
    {name:"Form 5",items:[
      "Pelajaran 1: Surah at-Taubah, Ayat 128–129",
      "Pelajaran 2: Surah al-Hashr, Ayat 21–24",
      "Pelajaran 3: Hukum Tajwid: Ra', Waqaf dan Ibtida'",
      "Pelajaran 4: Ciri-ciri Mukmin Berjaya",
      "Pelajaran 5: Memahami Keutamaan dalam Tindakan",
      "Pelajaran 6: Kepelbagaian Bangsa dalam Islam",
      "Pelajaran 7: Setiap Orang Ialah Pemimpin",
      "Pelajaran 8: Tujuh Golongan yang Mendapat Naungan Allah SWT",
      "Pelajaran 9: Allah SWT Maha Mengawasi dan Maha Menyaksikan",
      "Pelajaran 10: Akidah Ahli Sunnah Waljamaah",
      "Pelajaran 11: Solat Sunat Istikharah dan Solat Sunat Tasbih",
      "Pelajaran 12: Perkahwinan",
      "Pelajaran 13: Isu-isu dalam Perkahwinan",
      "Pelajaran 14: Pengurusan Harta Selepas Kematian",
      "Pelajaran 15: Jenayah dalam Islam",
      "Pelajaran 16: Kerajaan Uthmaniyah",
      "Pelajaran 17: Keunggulan Tokoh Islam",
      "Pelajaran 18: Tawaduk Menyantuni Kesucian Jiwa",
      "Pelajaran 19: Istiqamah Jalan Menuju Mujahadah",
      "Pelajaran 20: Alam Sekitar Penenang Minda",
      "Pelajaran 21: Sifat Mazmumah Meracuni Hati"
    ]}
  ]}
];

const STORAGE_KEY="theNerdSPMProgress_v2";
let saved={};
try{saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}")||{}}catch(e){saved={}}
const escapeHTML=s=>s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function render(){
  const all=[];
  subjects.forEach((s,si)=>s.forms.forEach((f,fi)=>f.items.forEach((item,ci)=>{
    all.push({id:`${si}-${fi}-${ci}`,subject:s.name,item,form:f.name,checked:!!saved[`${si}-${fi}-${ci}`]});
  })));
  const completed=all.filter(x=>x.checked).length;
  document.getElementById("done").textContent=completed;
  document.getElementById("total").textContent=all.length;
  const pct=Math.round(completed/all.length*100);
  document.getElementById("percent").textContent=pct+"%";
  document.getElementById("bar").style.width=pct+"%";
  const query=document.getElementById("search").value.trim().toLowerCase();
  const filter=document.getElementById("filter").value;
  const root=document.getElementById("subjects");root.innerHTML="";let shown=0;
  subjects.forEach((s,si)=>{
    const entries=all.filter(x=>x.subject===s.name),count=entries.length,done=entries.filter(x=>x.checked).length,isComplete=done===count;
    if((filter==="complete"&&!isComplete)||(filter==="incomplete"&&isComplete))return;
    const searchable=(s.name+" "+entries.map(x=>x.form+" "+x.item).join(" ")).toLowerCase();
    if(query&&!searchable.includes(query))return;
    const card=document.createElement("section");card.className="subject";
    let content=`<div class="head"><div><h2>${escapeHTML(s.name)}</h2><small>${done} of ${count} completed</small></div><span class="count">${Math.round(done/count*100)}%</span></div><div class="progress"><i style="width:${done/count*100}%"></i></div>`;
    s.forms.forEach((f,fi)=>{
      const formDone=f.items.filter((_,ci)=>!!saved[`${si}-${fi}-${ci}`]).length;
      content+=`<div class="form-block"><div class="form-title"><span>${escapeHTML(f.name)}</span><span>${formDone}/${f.items.length}</span></div><div class="chapters">`;
      f.items.forEach((item,ci)=>{const id=`${si}-${fi}-${ci}`;content+=`<label class="chapter"><input type="checkbox" data-id="${id}" ${saved[id]?"checked":""}><span>${escapeHTML(item)}</span></label>`});
      content+="</div></div>";
    });
    card.innerHTML=content;root.appendChild(card);shown++;
  });
  if(!shown)root.innerHTML='<div class="empty">No matching subjects or chapters.</div>';
  root.querySelectorAll('input[type="checkbox"]').forEach(input=>input.addEventListener("change",()=>{
    saved[input.dataset.id]=input.checked;localStorage.setItem(STORAGE_KEY,JSON.stringify(saved));render();
  }));
}
document.getElementById("search").addEventListener("input",render);
document.getElementById("filter").addEventListener("change",render);
document.getElementById("reset").addEventListener("click",()=>{
  if(confirm("Reset all chapter progress? This cannot be undone.")){saved={};localStorage.removeItem(STORAGE_KEY);render()}
});
render();
</script>
</body>
</html>
